<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Panel | Doña Compra</title>
<link rel="icon" href="../assets/dona-compra-emblema-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Los mismos cuatro colores del sitio. El panel es parte de la casa, no una
     herramienta aparte: quien entra tiene que reconocer dónde está. */
  :root {
    --verde: #163923;
    --verde-oscuro: #102919;
    --verde-claro: #1f5132;
    --ocre: #de9b2b;
    --ocre-oscuro: #b88124;
    --ocre-ink: #875f1a;
    --salvia: #709a7d;
    --marfil: #f5f2eb;
    --grad: #e2ebe5;
    --ink: #2f4237;
    --muted: #4f5c54;
    --error: #b3261e;
    --ok: #1f7a46;
    --radio: 12px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--marfil);
    color: var(--ink);
    font-family: Jost, system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.6;
  }

  h1, h2, h3 { font-family: Montserrat, sans-serif; color: var(--verde); line-height: 1.2; margin: 0; }

  a { color: var(--ocre-ink); }

  :focus-visible { outline: 2px solid var(--ocre); outline-offset: 2px; }

  .caja { max-width: 820px; margin: 0 auto; padding: clamp(18px, 4vw, 40px); }

  /* --- Barra ------------------------------------------------------------- */
  header.barra {
    background: var(--verde);
    color: var(--marfil);
    border-bottom: 3px solid var(--ocre);
  }
  .barra .caja {
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px;
    padding-top: 16px; padding-bottom: 16px;
  }
  .barra h1 { color: var(--marfil); font-size: 19px; letter-spacing: 0.02em; }
  .barra .rotulo { font-size: 10.5px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ocre); }
  .barra .derecha { margin-left: auto; display: flex; align-items: center; gap: 14px; }
  .barra .quien { font-size: 13.5px; color: rgba(245,242,235,0.75); }

  /* --- Controles --------------------------------------------------------- */
  button {
    font: inherit; cursor: pointer; border-radius: 999px; border: 0;
    padding: 11px 22px; font-weight: 600; font-size: 14.5px;
    transition: background 0.15s, border-color 0.15s;
  }
  .b-primario { background: var(--ocre); color: var(--verde); }
  .b-primario:hover:not(:disabled) { background: var(--ocre-oscuro); }
  .b-secundario { background: transparent; color: var(--marfil); border: 1px solid rgba(245,242,235,0.4); }
  .b-secundario:hover { border-color: var(--marfil); }
  button:disabled { opacity: 0.55; cursor: progress; }

  label { display: block; margin-top: 18px; }
  label > span.nombre {
    display: block; font-size: 13px; font-weight: 600; color: var(--verde);
    margin-bottom: 5px;
  }
  label > span.ayuda { display: block; font-size: 13px; color: var(--muted); margin-top: 4px; }

  input[type="text"], input[type="email"], input[type="password"], textarea {
    width: 100%; font: inherit; color: var(--ink);
    padding: 11px 13px; border: 1px solid rgba(22,57,35,0.28);
    border-radius: var(--radio); background: #fff;
  }
  input:focus, textarea:focus { border-color: var(--ocre); outline: none; box-shadow: 0 0 0 3px rgba(222,155,43,0.25); }
  textarea { min-height: 76px; resize: vertical; }

  /* --- Bloques ----------------------------------------------------------- */
  .tarjeta {
    background: #fff; border: 1px solid rgba(22,57,35,0.12);
    border-radius: var(--radio); padding: clamp(18px, 3vw, 28px);
    margin-top: 20px;
  }
  .tarjeta > h2 { font-size: clamp(18px, 2.4vw, 22px); }
  .tarjeta > p.intro { margin: 6px 0 0; font-size: 14.5px; color: var(--muted); }

  .aviso {
    border-radius: var(--radio); padding: 12px 16px; margin-top: 16px;
    font-size: 14.5px; border: 1px solid;
  }
  .aviso.error { background: #fdf0ef; border-color: var(--error); color: #7a1a15; }
  .aviso.ok    { background: #eef7f1; border-color: var(--ok);    color: #14532d; }
  .aviso.nota  { background: var(--grad); border-color: rgba(22,57,35,0.2); color: var(--ink); }

  .pie-acciones {
    display: flex; flex-wrap: wrap; align-items: center; gap: 14px;
    margin-top: 26px; padding-top: 20px; border-top: 1px solid rgba(22,57,35,0.12);
  }
  .pie-acciones .estado { font-size: 14px; color: var(--muted); }

  /* --- Portada ----------------------------------------------------------- */
  .portada { display: grid; gap: 16px; margin-top: 16px; }
  @media (min-width: 620px) { .portada { grid-template-columns: 260px 1fr; align-items: start; } }
  .portada .vista {
    position: relative; aspect-ratio: 5 / 4; overflow: hidden;
    border-radius: var(--radio); background: var(--grad);
    display: grid; place-items: center;
  }
  .portada .vista img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .portada .vista span { font-size: 13.5px; color: var(--muted); padding: 12px; text-align: center; }

  /* --- Acceso ------------------------------------------------------------ */
  .acceso { min-height: 70vh; display: grid; place-items: center; }
  .acceso .tarjeta { width: min(420px, 100%); margin: 0; }

  .oculto { display: none !important; }
  .sr {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
</style>
</head>
<body>

<!-- ========================= ACCESO ========================= -->
<main id="pantalla-acceso" class="caja acceso">
  <form class="tarjeta" id="form-acceso" autocomplete="on">
    <span class="rotulo" style="font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ocre-ink)">Panel</span>
    <h2 style="margin-top:6px">Doña Compra</h2>
    <p class="intro">Entrá con la cuenta de administración.</p>

    <label>
      <span class="nombre">Correo</span>
      <input type="email" id="correo" name="email" autocomplete="username" required>
    </label>
    <label>
      <span class="nombre">Contraseña</span>
      <input type="password" id="clave" name="password" autocomplete="current-password" required>
    </label>

    <div id="aviso-acceso" class="aviso error oculto" role="alert"></div>

    <div class="pie-acciones">
      <button type="submit" class="b-primario" id="b-entrar">Entrar</button>
    </div>
  </form>
</main>

<!-- ========================= PANEL ========================= -->
<div id="pantalla-panel" class="oculto">
  <header class="barra">
    <div class="caja">
      <div>
        <div class="rotulo">Panel de administración</div>
        <h1>Doña Compra</h1>
      </div>
      <div class="derecha">
        <span class="quien" id="quien"></span>
        <button type="button" class="b-secundario" id="b-salir">Salir</button>
      </div>
    </div>
  </header>

  <main class="caja">
    <form class="tarjeta" id="form-config">
      <h2>Configuración</h2>
      <p class="intro">
        Lo que se cambia acá cambia en todo el sitio. El teléfono, además, es el
        del botón flotante de WhatsApp.
      </p>

      <label>
        <span class="nombre">WhatsApp</span>
        <input type="text" id="telefono" required>
        <span class="ayuda">Como se escribe en Paraguay: 0994 876 333.</span>
      </label>

      <label>
        <span class="nombre">Correo</span>
        <input type="email" id="correo-config" required>
      </label>

      <label>
        <span class="nombre">Dirección</span>
        <textarea id="domicilio" required></textarea>
      </label>

      <label>
        <span class="nombre">Zona</span>
        <input type="text" id="zona" required>
        <span class="ayuda">Dónde atiende Doña Compra. Sale en el pie.</span>
      </label>

      <label>
        <span class="nombre">Horario</span>
        <textarea id="horario" required></textarea>
      </label>

      <label>
        <span class="nombre">Instagram</span>
        <input type="text" id="instagram" placeholder="https://www.instagram.com/...">
        <span class="ayuda">Vacío saca el botón del sitio.</span>
      </label>

      <label>
        <span class="nombre">Facebook</span>
        <input type="text" id="facebook" placeholder="https://www.facebook.com/...">
      </label>

      <h3 style="margin-top:30px;font-size:16px">Imagen de portada</h3>
      <div class="portada">
        <div class="vista" id="vista-portada">
          <span>Sin imagen propia: el sitio usa la que trae.</span>
        </div>
        <div>
          <label style="margin-top:0">
            <span class="nombre">Subir una imagen</span>
            <input type="file" id="archivo-portada" accept="image/jpeg,image/png,image/webp,image/avif">
            <span class="ayuda">
              JPG, PNG, WebP o AVIF, hasta 8 MB. Horizontal y de al menos
              1600 px de ancho se ve bien en cualquier pantalla.
            </span>
          </label>
          <label>
            <span class="nombre">Qué se ve en la imagen</span>
            <input type="text" id="portada-alt">
            <span class="ayuda">
              Lo lee quien no puede ver la foto. Describí la escena, no pongas
              «imagen de portada».
            </span>
          </label>
          <button type="button" class="b-primario" id="b-quitar-portada" style="margin-top:14px;background:transparent;border:1px solid rgba(22,57,35,.3);color:var(--ink)">
            Volver a la imagen original
          </button>
        </div>
      </div>

      <div id="aviso-config" class="aviso oculto" role="status"></div>

      <div class="pie-acciones">
        <button type="submit" class="b-primario" id="b-guardar">Guardar cambios</button>
        <span class="estado" id="estado-config"></span>
      </div>
    </form>
  </main>
</div>

<script src="./panel.js"></script>
</body>
</html>
